<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produkty — Apollon Hub API</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="produkty">

<div id="site-header-slot"></div>

<main>
  <section class="section" style="padding-top:60px;">
    <div class="container">
      <div class="section-head" style="margin-bottom:50px;">
        <div class="tag">Sklep</div>
        <h2>Produkty</h2>
        <p>Licencjonowane modele i skrypty do Twojej gry Roblox. Po zakupie licencja pojawi się automatycznie na stronie "Moje licencje".</p>
      </div>

      <!--
        Lista produktów i kategorie filtrowania są sterowane z pliku assets/products.js —
        żeby dodać/usunąć/zmienić produkt albo kategorię, edytuj AV_PRODUCTS /
        AV_PRODUCT_CATEGORIES w tym pliku, nie ten HTML.
      -->
      <div class="filter-pills" id="productsFilters"></div>
      <div class="grid" id="productsGrid"></div>

      <p style="text-align:center;color:var(--text-muted);font-size:13px;margin-top:40px;">
        Kupione produkty zobaczysz automatycznie na stronie
        <a href="licencje.html" style="color:var(--accent-2);font-weight:700;">Moje licencje</a> po zalogowaniu kontem Discord.
      </p>
    </div>
  </section>
</main>

<div id="site-footer-slot"></div>

<script src="assets/include.js"></script>
<script src="assets/birthday.js"></script>
<script src="assets/products.js"></script>
</body>
</html>
